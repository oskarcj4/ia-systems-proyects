spring:
  application:
    name: notas

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:6432/app}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}

    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000   # ms

  flyway:
    url: ${FLYWAY_URL:jdbc:postgresql://localhost:5433/app}
    user: ${DB_USER}
    password: ${DB_PASSWORD}

  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
        